name: Pull request

on:
  pull_request:

permissions:
  contents: read

env:
  KUBB_DISABLE_TELEMETRY: '1'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: go-task/setup-task@v2
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/setup@v3
        with:
          working-directory: frontend
          # the tasks install the Frontend's dependencies themselves, as they do locally
          install: false
      - name: Lint
        run: task lint
      - name: Format check
        run: task format:check
      - name: Type check
        run: task typecheck
      # builds the image without publishing it, for the end-to-end tests
      - name: Test
        run: task test
      - name: Client staleness
        run: task frontend:client:check
