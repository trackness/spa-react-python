name: Pull request

on:
  pull_request:

permissions: {}

env:
  KUBB_DISABLE_TELEMETRY: '1'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: frontend
          # the tasks install the Frontend's dependencies themselves, as they do locally
          install: false
      - name: Lint
        run: task lint
      - name: Format check
        run: task format:check
      - name: Type check
        run: task typecheck
      # builds the Image without publishing it, for the end-to-end tests
      - name: Test
        run: task test
      - name: Client staleness
        run: task frontend:client:check
