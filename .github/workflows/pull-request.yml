name: Pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: go-task/setup-task@v2
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Lint
        run: task lint
      - name: Format check
        run: task format:check
      - name: Type check
        run: task typecheck
      - name: Test
        run: task test
